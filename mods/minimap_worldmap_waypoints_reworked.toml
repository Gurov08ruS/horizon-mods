name = "Minimap, Worldmap and waypoints reworked"
summary = "An adaptive minimap and world map with named waypoints, portals, world borders and a biome readout."
description = """
An adaptive minimap and a full world map for Horizon, with a shared in-memory terrain cache.

- Minimap in four corners, square or round, 64–256 GUI pixels, 0.1–4 blocks per pixel, and optional player rotation.
- Player arrow on both maps shows the viewing direction and accounts for minimap rotation.
- English, Russian, French, Spanish and German interfaces follow the game language, including regional variants.
- World map opened by a rebindable key (M by default); drag to pan and scroll to zoom under the cursor, with eased camera motion.
- Independent dimension selection for the minimap and the world map (Player / Overworld / Nether / End), without teleporting the player.
- Hover shows the pointed-at coordinates, the localised biome and waypoint names; the hovered block is outlined.
- Right-click menu: copy coordinates, create a named waypoint, or teleport when the client knows the player has game-master permission.
- Separate waypoint manager (N by default) for creating, renaming and deleting waypoints; waypoints are drawn as first-letter markers on the HUD through walls and on both maps.
- Water and glass-family blocks are semi-transparent, water tint thickens with depth, grass-like ground cover is skipped, and flowers/crops use their real colours.
- Portals (Nether, End and End gateways) are marked and show their destination; Nether destinations prefer the nearest known portal, otherwise coordinate conversion.
- Overworld and Nether world borders are drawn on both maps (the Nether border is scaled to the same physical area).
- Relief shading crosses chunk borders; unknown terrain is transparent; the minimap renders at high resolution for smooth movement.
- Settings and named waypoints persist asynchronously in the mod data folder. Waypoints are isolated by save/server identity and dimension, with 64 points per world/server. Legacy unscoped points are deleted on upgrade; preferences are retained.
- Large-map terrain is drawn as GPU tiles and retains original terrain texels at every zoom. Detailed and LOD terrain, including known biome names, stays in RAM for the current connection. No network requests are made by the mod.
- Each of the 67 vanilla biomes has an individual 16×16 icon. Waypoint colours can be edited, and Show on map centres the world map on a selected waypoint.
- World, actual-render/LOD and chunk-render borders have hover labels; right-click outlines the selected chunk and region.

The runtime uses only portable standard-library APIs and is intended for Linux, macOS and Windows. This release has not been reviewed in live gameplay; macOS and Windows runs remain unverified.
"""
